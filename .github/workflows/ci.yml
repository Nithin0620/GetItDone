name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build
        env:
          AUTH_SECRET: ci-secret-placeholder-for-build-checks
          AUTH_GOOGLE_ID: ci-google-id-placeholder
          AUTH_GOOGLE_SECRET: ci-google-secret-placeholder
